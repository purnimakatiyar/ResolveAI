version: "3.9"

services:
  api:
    build: .
    container_name: resolveai_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery:
    build: .
    container_name: resolveai_celery
    command: celery -A core.celery_app worker -Q ai --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: resolveai_redis
    ports:
      - "6379:6379"
